name: Deploy to AwardSpace

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: List FTP root (shows folder names in the log)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: curl -s --list-only --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/"

      - name: Sync files over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          server-dir: /hdropshipping.com/
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/config.php
            **/config.json
            **/uploads/**
            **/node_modules/**
            **/test-groq.php
            **/tempCodeRunnerFile.php
            **/fix-icons.php
            **/download-logos.php
